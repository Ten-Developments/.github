name: Merge Freeze Check

# This is the CALLER workflow. It enrolls this repo in the org-level
# branch freeze policy (task TEN-TR01_00001).
#
# The freeze logic itself lives in the reusable workflow:
#   Ten-Developments/.github/.github/workflows/freeze-check.yml
# This file just triggers the check on PR events and on a cron schedule.
#
# To customize the freeze policy for this specific repo, uncomment and
# edit the `with:` block below to set custom inputs:
#   - timezone: IANA timezone (default: America/Los_Angeles)
#   - friday_is_weekend: treat Friday as weekend (default: true)
#   - holiday_calendars: comma-separated list of calendars (default: us_federal,mexico_federal)
#   - custom_dates: comma-separated YYYY-MM-DD dates for ad-hoc freezes

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main
  # NOTE: schedule trigger disabled 2026-06-29 due to GitHub Actions
  # minutes quota exhaustion. The freeze is still enforced on every
  # PR event (opened, reopened, synchronize, ready_for_review) and the
  # Org Ruleset re-evaluates the freeze-check status when a merge is
  # attempted, so merges are blocked during freeze windows even without
  # the periodic cron re-evaluation.
  # To re-enable: uncomment the schedule block below.
  # schedule:
  #   - cron: "*/30 * * * *"

# The reusable workflow needs statuses:write to post commit statuses
# via the GitHub API. This permission is inherited by the reusable workflow.

permissions:
  contents: read
  statuses: write

jobs:
  freeze:
    uses: Ten-Developments/.github/.github/workflows/freeze-check.yml@main
    with:
      timezone: "America/Los_Angeles"
      friday_is_weekend: true
      holiday_calendars: "us_federal,mexico_federal"
      # custom_dates: "2026-12-15,2027-01-05"   # example: freeze a specific date range
