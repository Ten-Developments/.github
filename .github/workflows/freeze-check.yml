# Branch Freeze Check (reusable)
#
# This workflow is the SINGLE SOURCE OF TRUTH for the Ten-Developments
# branch freeze policy (task TEN-TR01_00001).
#
# Rules (configurable via inputs):
#   - Block merges on weekends (Friday/Saturday/Sunday) — Friday included
#   - Block merges on US federal holidays:
#       * New Year's Day (Jan 1)
#       * Independence Day (Jul 4)
#       * Labor Day (first Monday in September)
#       * Thanksgiving (fourth Thursday in November)
#       * Day after Thanksgiving (fourth Friday in November)
#       * Christmas Eve (Dec 24)
#       * Christmas (Dec 25)
#       * New Year's Eve (Dec 31)
#   - Block merges on Mexican federal holidays:
#       * New Year's Day (Jan 1)
#       * Constitution Day (first Monday in February)
#       * Benito Juárez Day (third Monday in March)
#       * Labor Day (May 1)
#       * Independence Day (Sep 16)
#       * Revolution Day (third Monday in November)
#       * Christmas (Dec 25)
#   - Block merges on custom dates (per-repo or org-defined)
#
# The job name `freeze-check` is critical — the Org Ruleset references it
# exactly. Renaming it will silently disable enforcement.

name: Branch Freeze Check (reusable)

on:
  workflow_call:
    inputs:
      timezone:
        description: "IANA timezone for date evaluation"
        required: false
        type: string
        default: "America/Los_Angeles"
      friday_is_weekend:
        description: "Treat Friday as a weekend day (block merges on Friday too)"
        required: false
        type: boolean
        default: true
      holiday_calendars:
        description: "Comma-separated list of holiday calendars to enforce. Options: us_federal, mexico_federal"
        required: false
        type: string
        default: "us_federal,mexico_federal"
      custom_dates:
        description: "Comma-separated list of additional freeze dates in YYYY-MM-DD format (e.g. '2026-07-15,2026-08-20')"
        required: false
        type: string
        default: ""

jobs:
  freeze-check:
    name: freeze-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write   # required to post commit statuses via the API
    steps:
      - name: Check freeze window
        env:
          GH_TOKEN: ${{ github.token }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu

          TZ_INPUT="${{ inputs.timezone }}"
          FRIDAY_IS_WEEKEND="${{ inputs.friday_is_weekend }}"
          CALENDARS_INPUT="${{ inputs.holiday_calendars }}"
          CUSTOM_DATES_INPUT="${{ inputs.custom_dates }}"

          DAY=$(TZ="$TZ_INPUT" date +%u)        # 1=Mon, 7=Sun
          DATE=$(TZ="$TZ_INPUT" date +%Y-%m-%d)
          YEAR=$(TZ="$TZ_INPUT" date +%Y)
          MONTH=$(TZ="$TZ_INPUT" date +%-m)
          DAY_OF_MONTH=$(TZ="$TZ_INPUT" date +%-d)

          echo "Today is $DATE (day-of-week: $DAY) in timezone $TZ_INPUT"
          echo "Friday is weekend: $FRIDAY_IS_WEEKEND"
          echo "Holiday calendars: $CALENDARS_INPUT"
          echo "Custom dates: ${CUSTOM_DATES_INPUT:-<none>}"

          # ----------------------------------------------------------------
          # Rule 1: Block on weekends (Friday/Saturday/Sunday)
          # ----------------------------------------------------------------
          if [ "$FRIDAY_IS_WEEKEND" = "true" ]; then
            WEEKEND_THRESHOLD=5   # Friday (5) is the first weekend day
          else
            WEEKEND_THRESHOLD=6   # Saturday (6) is the first weekend day
          fi

          if [ "$DAY" -ge "$WEEKEND_THRESHOLD" ]; then
            DOW_NAME=$(TZ="$TZ_INPUT" date +%A)
            FROZEN=1
            FROZEN_REASON="Merges are blocked on $DOW_NAME."
          fi

          # ----------------------------------------------------------------
          # Rule 2: Block on holidays (US federal and/or Mexican federal)
          # ----------------------------------------------------------------
          # Note: FROZEN and FROZEN_REASON may already be set by Rule 1 above.
          if [ -z "${FROZEN_REASON:-}" ]; then
            FROZEN=0
            FROZEN_REASON=""
          fi

          # Check if today matches a fixed-date holiday in any active calendar
          check_fixed_holiday() {
            local mm_dd="$1"
            local name="$2"
            case "$DATE" in
              "${YEAR}-${mm_dd}")
                FROZEN=1
                FROZEN_REASON="$name"
                ;;
            esac
          }

          # US federal holidays (fixed dates)
          if echo "$CALENDARS_INPUT" | grep -q "us_federal"; then
            check_fixed_holiday "01-01" "New Year's Day (US)"
            check_fixed_holiday "07-04" "Independence Day (US)"
            check_fixed_holiday "12-24" "Christmas Eve (US)"
            check_fixed_holiday "12-25" "Christmas (US)"
            check_fixed_holiday "12-31" "New Year's Eve (US)"
          fi

          # Mexican federal holidays (fixed dates)
          if echo "$CALENDARS_INPUT" | grep -q "mexico_federal"; then
            check_fixed_holiday "01-01" "New Year's Day (Mexico)"
            check_fixed_holiday "05-01" "Labor Day (Mexico)"
            check_fixed_holiday "09-16" "Independence Day (Mexico)"
            check_fixed_holiday "12-25" "Christmas (Mexico)"
          fi

          # ----------------------------------------------------------------
          # Rule 3: Floating-date holidays (nth weekday of month)
          # ----------------------------------------------------------------

          # US Labor Day = first Monday of September
          if [ "$FROZEN" -eq 0 ] && [ "$MONTH" -eq 9 ] && echo "$CALENDARS_INPUT" | grep -q "us_federal"; then
            FIRST_DOW=$(TZ="$TZ_INPUT" date -d "${YEAR}-09-01" +%u)
            LABOR_DAY=$(( ((8 - FIRST_DOW) % 7) + 1 ))
            if [ "$DAY_OF_MONTH" -eq "$LABOR_DAY" ]; then
              FROZEN=1
              FROZEN_REASON="Labor Day (US, first Monday in September)"
            fi
          fi

          # US Thanksgiving = fourth Thursday in November
          # US Day-after-Thanksgiving = fourth Friday in November
          # Note: if Friday is weekend, this is already blocked by Rule 1;
          # this just provides the holiday name.
          if [ "$FROZEN" -eq 0 ] && [ "$MONTH" -eq 11 ] && echo "$CALENDARS_INPUT" | grep -q "us_federal"; then
            FIRST_DOW=$(TZ="$TZ_INPUT" date -d "${YEAR}-11-01" +%u)
            FIRST_THU=$(( ((11 - FIRST_DOW) % 7) + 1 ))
            THANKSGIVING=$(( FIRST_THU + 21 ))
            DAY_AFTER=$(( THANKSGIVING + 1 ))
            if [ "$DAY_OF_MONTH" -eq "$THANKSGIVING" ]; then
              FROZEN=1
              FROZEN_REASON="Thanksgiving (US, fourth Thursday in November)"
            elif [ "$DAY_OF_MONTH" -eq "$DAY_AFTER" ]; then
              FROZEN=1
              FROZEN_REASON="Day after Thanksgiving (US)"
            fi
          fi

          # Mexican Constitution Day = first Monday of February
          if [ "$FROZEN" -eq 0 ] && [ "$MONTH" -eq 2 ] && echo "$CALENDARS_INPUT" | grep -q "mexico_federal"; then
            FIRST_DOW=$(TZ="$TZ_INPUT" date -d "${YEAR}-02-01" +%u)
            CONSTITUTION_DAY=$(( ((8 - FIRST_DOW) % 7) + 1 ))
            if [ "$DAY_OF_MONTH" -eq "$CONSTITUTION_DAY" ]; then
              FROZEN=1
              FROZEN_REASON="Constitution Day (Mexico, first Monday in February)"
            fi
          fi

          # Mexican Benito Juárez Day = third Monday of March
          if [ "$FROZEN" -eq 0 ] && [ "$MONTH" -eq 3 ] && echo "$CALENDARS_INPUT" | grep -q "mexico_federal"; then
            FIRST_DOW=$(TZ="$TZ_INPUT" date -d "${YEAR}-03-01" +%u)
            FIRST_MON=$(( ((8 - FIRST_DOW) % 7) + 1 ))
            BENITO_DAY=$(( FIRST_MON + 14 ))   # third Monday = first + 2 weeks
            if [ "$DAY_OF_MONTH" -eq "$BENITO_DAY" ]; then
              FROZEN=1
              FROZEN_REASON="Benito Juárez Day (Mexico, third Monday in March)"
            fi
          fi

          # Mexican Revolution Day = third Monday of November
          if [ "$FROZEN" -eq 0 ] && [ "$MONTH" -eq 11 ] && echo "$CALENDARS_INPUT" | grep -q "mexico_federal"; then
            FIRST_DOW=$(TZ="$TZ_INPUT" date -d "${YEAR}-11-01" +%u)
            FIRST_MON=$(( ((8 - FIRST_DOW) % 7) + 1 ))
            REVOLUTION_DAY=$(( FIRST_MON + 14 ))   # third Monday = first + 2 weeks
            if [ "$DAY_OF_MONTH" -eq "$REVOLUTION_DAY" ]; then
              FROZEN=1
              FROZEN_REASON="Revolution Day (Mexico, third Monday in November)"
            fi
          fi

          # ----------------------------------------------------------------
          # Rule 4: Custom dates (per-repo or org-defined)
          # ----------------------------------------------------------------
          if [ "$FROZEN" -eq 0 ] && [ -n "$CUSTOM_DATES_INPUT" ]; then
            # Iterate over comma-separated dates
            IFS=','
            for CUSTOM_DATE in $CUSTOM_DATES_INPUT; do
              # Trim whitespace
              CUSTOM_DATE=$(echo "$CUSTOM_DATE" | tr -d ' ')
              if [ "$DATE" = "$CUSTOM_DATE" ]; then
                FROZEN=1
                FROZEN_REASON="Custom freeze date: $CUSTOM_DATE"
                break
              fi
            done
            unset IFS
          fi

          # ----------------------------------------------------------------
          # Final decision — post a commit status instead of failing the job.
          #
          # Why: exiting with a non-zero code marks the *job* as failed, which
          # triggers GitHub's "workflow failed" notification emails. Instead we
          # post a `failure` commit status directly to the API so the PR merge
          # button stays blocked, but the job itself always exits cleanly (0)
          # and no failure emails are sent.
          #
          # The status context "freeze-check" must match the name registered in
          # the Org Ruleset as a required status check.
          #
          # On cron-triggered runs there is no PR SHA available, so we skip the
          # API call — the cron run is just a heartbeat that stays green.
          # ----------------------------------------------------------------
          if [ "$FROZEN" -eq 1 ]; then
            echo "Freeze: merges are blocked on $DATE ($FROZEN_REASON)."
            STATUS_STATE="failure"
            STATUS_DESC="❌ Branch frozen: $FROZEN_REASON"
          else
            echo "No freeze active. Merge window is open ($DATE)."
            STATUS_STATE="success"
            STATUS_DESC="✅ Merge window is open."
          fi

          if [ -n "${PR_SHA:-}" ]; then
            echo "Posting commit status '$STATUS_STATE' to $PR_SHA"
            curl -s -f -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/statuses/$PR_SHA" \
              -d "{
                \"state\": \"$STATUS_STATE\",
                \"context\": \"freeze-check\",
                \"description\": \"$STATUS_DESC\"
              }"
          else
            # Cron run — no PR SHA, nothing to post. Job completes green.
            echo "Cron run (no PR SHA). Skipping commit status post."
          fi

          # Always exit 0 — the job itself never fails, preventing email alerts.
          exit 0
